# Tool configuration. The code runs from its task folders (see README); this is
# not an installable package.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
# D1xx: every module, class and function in linted code has a docstring
# (they are the Doxygen API reference). __init__ and magic methods are
# documented on their class.
select = ["E", "F", "W", "I", "B", "UP", "D100", "D101", "D102", "D103", "D104"]
ignore = ["E731"]  # lambda assignment in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["lpsad"]
known-third-party = ["backbones"]

[tool.pytest.ini_options]
testpaths = ["train/tasks/panoptic/tests"]
